name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*' # Triggered on version tag push when creating a GitHub Release

permissions:
  id-token: write # Required for pub.dev OIDC authentication
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep '^version:' ./BlinkCard/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version (v$TAG) does not match BlinkCard/pubspec.yaml version ($PKG)"
            exit 1
          fi
          echo "Version match verified: v$TAG"

      - name: Prepare Package Subfolder
        run: cp README.md BlinkCard/

      - name: Install Dependencies
        working-directory: BlinkCard
        run: flutter pub get

      - name: Publish to pub.dev
        working-directory: BlinkCard
        run: dart pub publish --force